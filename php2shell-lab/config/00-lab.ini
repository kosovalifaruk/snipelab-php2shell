; SnipeLab comparison baseline, not a production template.
memory_limit = 64M
post_max_size = 2M
upload_max_filesize = 1M
max_file_uploads = 2
max_input_vars = 100
session.save_path = /tmp
session.upload_progress.enabled = 1
fatal_error_backtraces = 1
log_errors = On
display_errors = Off
error_log = /proc/self/fd/2
